name: Recover Witch Tools Dev v2.7.1 artifact

on:
  pull_request:
    branches: [Blender_Dev]
    paths:
      - .github/workflows/recover-witch-tools-v2-7-1.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and package
        run: |
          set +e
          python .github/scripts/recover_witch_tools_v271.py > recovery.log 2>&1
          status=$?
          cat recovery.log
          echo $status > recovery_status.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: Witch-Tools-Dev-v2-7-1-rebuilt
          path: |
            Witch_Tools_Dev_v2_7_1_Align_Selection_NPanel_Hotfix_Rebuilt_Blender_4_5.zip
            Witch_Tools_Dev_v2_7_1_BUILD_INFO.json
            recovery.log
            recovery_status.txt
          if-no-files-found: warn
          retention-days: 1
