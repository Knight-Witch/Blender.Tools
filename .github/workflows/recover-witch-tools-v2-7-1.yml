name: Recover Witch Tools Dev v2.7.1 artifact

on:
  pull_request:
    branches: [Blender_Dev]
    paths:
      - .github/workflows/recover-witch-tools-v2-7-1.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified Witch Tools Dev v2.6.1 source
        run: |
          python tools/restore_dev_snapshot.py addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1
          cd addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1/restored
          zip -9 -r "$GITHUB_WORKSPACE/Witch_Tools_Dev_v2_6_1_Restored_Source.zip" Witch_Tools_Dev

      - uses: actions/upload-artifact@v4
        with:
          name: Witch-Tools-Dev-v2-6-1-restored-source
          path: Witch_Tools_Dev_v2_6_1_Restored_Source.zip
          if-no-files-found: error
          retention-days: 1
