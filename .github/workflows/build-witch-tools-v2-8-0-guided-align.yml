name: Build Witch Tools Dev_v2.8.0 Guided Align source

on:
  push:
    branches:
      - feature/witch-tools-guided-align
    paths:
      - .github/workflows/build-witch-tools-v2-8-0-guided-align.yml

permissions:
  contents: write

jobs:
  reconstruct-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/witch-tools-guided-align
          fetch-depth: 0

      - name: Restore verified Dev_v2.6.1 baseline
        run: |
          python tools/restore_dev_snapshot.py addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1

      - name: Decode and apply Dev_v2.8.0 patch
        run: |
          base64 -d addons/witch_tools/dev/patches/Dev_v2_8_0/Witch_Tools_Dev_v2_8_0_Guided_Align.patch.xz.b64 \
            | xz -d > /tmp/Witch_Tools_Dev_v2_8_0.patch
          echo "8cc8f07360d06658668640f41d59c7bac1ecca1139d969e8f1c5140471af3a9d  /tmp/Witch_Tools_Dev_v2_8_0.patch" | sha256sum -c -
          cd addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1/restored
          patch -p1 < /tmp/Witch_Tools_Dev_v2_8_0.patch

      - name: Install direct unpacked development source
        run: |
          rm -rf addons/witch_tools/dev/Witch_Tools_Dev
          cp -a addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1/restored/Witch_Tools_Dev addons/witch_tools/dev/Witch_Tools_Dev
          rm -rf addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1/restored
          find addons/witch_tools/dev/Witch_Tools_Dev -type d -name __pycache__ -prune -exec rm -rf {} +
          find addons/witch_tools/dev/Witch_Tools_Dev -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Static validation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import ast, collections, math, re, sys
          from pathlib import Path

          root = Path('addons/witch_tools/dev/Witch_Tools_Dev')
          py_files = sorted(root.rglob('*.py'))
          identifiers = []
          for path in py_files:
              text = path.read_text(encoding='utf-8')
              ast.parse(text, filename=str(path))
              compile(text, str(path), 'exec')
              identifiers.extend(re.findall(r"bl_idname\s*=\s*['\"]([^'\"]+)['\"]", text))
          duplicates = [name for name, count in collections.Counter(identifiers).items() if count > 1]
          if duplicates:
              raise SystemExit(f'Duplicate bl_idname values: {duplicates}')
          if len([name for name in identifiers if name.startswith('mesh.wt_guided_align')]) != 7:
              raise SystemExit('Expected seven Guided Align operators')

          state = (root / 'state.py').read_text(encoding='utf-8')
          prefs = (root / 'preferences.py').read_text(encoding='utf-8')
          panel = (root / 'panel_edit_tools.py').read_text(encoding='utf-8')
          if 'ADDON_VERSION = (2, 8, 0)' not in state:
              raise SystemExit('Version metadata mismatch')
          if "section_icon='PIVOT_ACTIVE'" not in panel:
              raise SystemExit('Guided Align panel icon/source missing')
          ui_block = state[state.index('UI_STATE_PROPS'):state.index('PANEL_ORDERS')]
          names = re.findall(r"'((?:show_|vertex_locks_group_filter)[^']*)'", ui_block)
          missing = [name for name in names if not re.search(rf'^\s*{re.escape(name)}\s*:', prefs, re.M)]
          if missing:
              raise SystemExit(f'Missing preference declarations: {missing}')

          sys.path.insert(0, str(root))
          import guided_align_math as g
          assert g.match_components((1, 2, 3), (9, 8, 7), (False, True, True)) == (1.0, 8.0, 7.0)
          assert g.component_delta((1, 2, 3), (9, 8, 7), (False, True, True)) == (0.0, 6.0, 4.0)
          frame = g.build_frame((0, 0, 0), (1, 1, 0))
          point = g.to_frame((math.sqrt(0.5), math.sqrt(0.5), 0), frame)
          assert abs(point[0] - 1.0) < 1e-9 and abs(point[1]) < 1e-9 and abs(point[2]) < 1e-9
          assert abs(g.solve_slide_parameter((0, 0, 0), (0, 1, 1), (0, 2, 2), (False, True, True)) - math.sqrt(8)) < 1e-9
          try:
              g.solve_slide_parameter((0, 0, 0), (0, 1, 1), (0, 2, 3), (False, True, True))
          except ValueError:
              pass
          else:
              raise SystemExit('Incompatible rail constraints did not fail')
          print(f'Validated {len(py_files)} Python files and {len(identifiers)} identifiers')
          PY

      - name: Commit reconstructed source
        run: |
          git config user.name 'Knight Witch'
          git config user.email 'amanda.m.ivans@gmail.com'
          git rm -f .github/workflows/export-witch-tools-v2-7-1-source.yml || true
          git rm -f .github/workflows/build-witch-tools-v2-8-0-guided-align.yml
          git add addons/witch_tools/dev/Witch_Tools_Dev addons/witch_tools/dev/patches/Dev_v2_8_0
          git commit -m 'Add Witch Tools Dev_v2.8.0 Guided Align source'
          git push origin HEAD:feature/witch-tools-guided-align
