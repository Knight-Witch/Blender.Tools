name: Apply Witch Tools Dev v2.10.1 runtime fixes

on:
  push:
    branches:
      - feature/witch-tools-magic-branch
    paths:
      - .github/workflows/apply-witch-tools-v2-10-1-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/witch-tools-magic-branch
          fetch-depth: 0
      - name: Apply readable source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/wt2101_remaining_*.patch > /tmp/wt2101_remaining.patch
          test "$(sha256sum /tmp/wt2101_remaining.patch | awk '{print $1}')" = "533fd00b0722fc23816a9a92bf878df8d6416ccf2521354681a0879b83490374"
          cd addons/witch_tools/dev/Witch_Tools_Dev
          patch -p2 < /tmp/wt2101_remaining.patch
          cd ../../../..
          python - <<'PY'
          import ast, pathlib
          src = pathlib.Path('addons/witch_tools/dev/Witch_Tools_Dev')
          for path in sorted(src.rglob('*.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          assert "'version': (2, 10, 1)" in (src / '__init__.py').read_text(encoding='utf-8')
          assert "ADDON_VERSION = (2, 10, 1)" in (src / 'state.py').read_text(encoding='utf-8')
          print('Dev_v2.10.1 source syntax/version checks passed.')
          PY
      - name: Commit fix candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Knight Witch Dev Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/tmp/wt2101_remaining_*.patch
          rm -f .github/tmp/wt2101_remaining_*.b64
          rm -f .github/tmp/wt2101_patch_*.txt
          rm -f .github/tmp/wt2101_patch.gz.b64
          rm -f .github/tmp/wt2101_docs_apply.py.gz.b64
          rm -f .github/workflows/apply-witch-tools-v2-10-1-fixes.yml
          git add -A
          git commit -m "Fix Witch Tools Dev v2.10.1 runtime issues"
          git push origin HEAD:feature/witch-tools-magic-branch
