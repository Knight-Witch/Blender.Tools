name: WT2101 Finalize State 2
on:
  push:
    branches: [feature/witch-tools-magic-branch]
    paths: [.github/workflows/run-wt2101-finalizer-2.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/witch-tools-magic-branch
          fetch-depth: 0
      - run: python .github/tmp/finalize_wt2101.py
      - run: |
          set -euo pipefail
          git config user.name "Knight Witch Dev Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- .github/workflows/package-witch-tools-v2-10.yml
          rm -f .github/tmp/finalize_wt2101.py
          git add -A
          git commit -m "Finalize Witch Tools Dev v2.10.1 state"
          git push origin HEAD:feature/witch-tools-magic-branch
