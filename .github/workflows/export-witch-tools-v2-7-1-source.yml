name: Export Witch Tools Dev_v2.6.1 source

on:
  push:
    branches:
      - feature/witch-tools-guided-align
    paths:
      - .github/workflows/export-witch-tools-v2-7-1-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/witch-tools-guided-align

      - name: Restore verified Dev_v2.6.1 source
        run: |
          python tools/restore_dev_snapshot.py addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1

      - name: Package reconstructed source
        run: |
          cd addons/witch_tools/dev/snapshots/Witch_Tools_Dev_v2_6_1/restored
          zip -r "$GITHUB_WORKSPACE/Witch_Tools_Dev_v2_6_1_reconstructed_source.zip" Witch_Tools_Dev
          sha256sum "$GITHUB_WORKSPACE/Witch_Tools_Dev_v2_6_1_reconstructed_source.zip" > "$GITHUB_WORKSPACE/Witch_Tools_Dev_v2_6_1_reconstructed_source.sha256"

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: Witch_Tools_Dev_v2_6_1_reconstructed_source
          path: |
            Witch_Tools_Dev_v2_6_1_reconstructed_source.zip
            Witch_Tools_Dev_v2_6_1_reconstructed_source.sha256
          if-no-files-found: error
          retention-days: 3
